; Travel Empire production IVR and advisor routing
; Audio files are installed in /var/lib/asterisk/sounds/custom/travel-empire.

[from-telnyx]
exten => _X.,1,NoOp(Travel Empire inbound call to ${EXTEN})
 same => n,Set(CHANNEL(language)=en)
 same => n,GotoIfTime(09:00-18:59,mon-sun,*,America/Los_Angeles?te-main-menu,s,1:te-after-hours,s,1)

[te-main-menu]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(response)=8)
 same => n,Set(TIMEOUT(digit)=4)
 same => n,Background(custom/travel-empire/te-incoming-menu)
 same => n,WaitExten(8)
 same => n,Goto(i,1)
exten => 1,1,Goto(te-sales-queue,s,1)
exten => 2,1,Goto(te-manager,s,1)
exten => 3,1,Goto(te-external-forward,zoom,1)
exten => 4,1,Goto(te-external-forward,time2travel,1)
exten => 5,1,Goto(te-manager,s,1)
exten => _100[1-4],1,Goto(te-direct-extension,${EXTEN},1)
exten => i,1,Playback(custom/travel-empire/te-invalid-selection)
 same => n,Goto(s,2)
exten => t,1,Goto(te-general-voicemail,s,1)

[te-sales-queue]
exten => s,1,Playback(custom/travel-empire/te-queue-initial)
 same => n,Queue(incoming-sales,t,,,100)
 same => n,Goto(te-callback-request,s,1)

[te-manager]
exten => s,1,Dial(PJSIP/1003,30,t)
 same => n,Playback(custom/travel-empire/te-manager-unavailable)
 same => n,Voicemail(1003@travel-empire,u)
 same => n,Hangup()

[te-direct-extension]
exten => _100[1-4],1,Dial(PJSIP/${EXTEN},30,t)
 same => n,GotoIf($["${EXTEN}"="1001"]?dave)
 same => n,GotoIf($["${EXTEN}"="1002"]?nick)
 same => n,Goto(general)
 same => n(dave),Playback(custom/travel-empire/te-dave-1001-voicemail)
 same => n,Voicemail(1001@travel-empire,u)
 same => n,Hangup()
 same => n(nick),Playback(custom/travel-empire/te-nick-1002-voicemail)
 same => n,Voicemail(1002@travel-empire,u)
 same => n,Hangup()
 same => n(general),Playback(custom/travel-empire/te-general-voicemail)
 same => n,Voicemail(${EXTEN}@travel-empire,u)
 same => n,Hangup()

[te-external-forward]
exten => zoom,1,Set(CALLERID(name)=Travel Empire)
 same => n,Set(CALLERID(num)=+17252249003)
 same => n,Dial(PJSIP/+17024936777@telnyx,60)
 same => n,Goto(te-general-voicemail,s,1)
exten => time2travel,1,Set(CALLERID(name)=Travel Empire)
 same => n,Set(CALLERID(num)=+17252249003)
 same => n,Dial(PJSIP/+17029918220@telnyx,60)
 same => n,Goto(te-general-voicemail,s,1)

[te-callback-request]
exten => s,1,NoOp(Capture callback request after sales queue timeout)
 same => n,Playback(custom/travel-empire/te-general-voicemail)
 same => n,Voicemail(1000@travel-empire,u)
 same => n,Hangup()

[te-general-voicemail]
exten => s,1,Playback(custom/travel-empire/te-general-voicemail)
 same => n,Voicemail(1000@travel-empire,u)
 same => n,Hangup()

[te-after-hours]
exten => s,1,Answer()
 same => n,Playback(custom/travel-empire/te-after-hours)
 same => n,Voicemail(1000@travel-empire,u)
 same => n,Hangup()

; Broadcast recipient interaction. The calling application sets TE_CONTACT_ID.
[te-broadcast-response]
exten => s,1,Answer()
 same => n,Playback(custom/travel-empire/te-press1-hold)
 same => n,WaitExten(8)
 same => n,Hangup()
exten => 1,1,Goto(te-sales-queue,s,1)
exten => 9,1,Set(DB(te-dnc/${CALLERID(num)})=${STRFTIME(${EPOCH},,%Y-%m-%dT%H:%M:%S%z)}|${TE_CONTACT_ID})
 same => n,UserEvent(TravelEmpireDNC,Phone:${CALLERID(num)},ContactID:${TE_CONTACT_ID},Source:broadcast)
 same => n,Playback(custom/travel-empire/te-dnc-confirmation)
 same => n,Hangup()
exten => i,1,Playback(custom/travel-empire/te-invalid-selection)
 same => n,Goto(s,2)

